name: Build & Deploy

on:
  push:
    branches: ['main']

jobs:

  mirror:
    runs-on: codeberg-tiny

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 'Mirror to Github'
        uses: https://github.com/cssnr/mirror-repository-action@v1
        with:
          url: https://github.com/aninusmuffin/aninus.com
          create: true
          username: aninusmuffin
          password: ${{ secrets.MIRROR_TOKEN }}

  build:
    runs-on: codeberg-tiny

    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/checkout@v6

      - name: Install dependencies
        run: npm install

      - name: Running Eleventy
        run: npm run build:eleventy
          
      - name: Deploy to Cloudflare
        uses: https://github.com/cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=aninus