---

layout: base
title: Pattern Library
description: ""
eleventyExcludeFromCollections: ["pattern-library"]

---

{% render 'blocks/navbar.liquid', page:page %}

<main>

<div class="headline region wrapper">
    <div class="content flow">
        <h1>{{title}}</h1>
        <p>{{description}}</p>
    </div>
</div>

<div class="wrapper flow">
    <ul class="boxed-list">
    {% for pattern in collections.pattern-library %}
        <li><a href="{{ pattern.url }}">{{ pattern.data.title }}</a></li>
    {% endfor %}
    </ul>
</div>

</main>
